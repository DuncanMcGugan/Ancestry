:root {
  --navy: #14263f;
  --navy-2: #1d3a5f;
  --teal: #167e7a;
  --teal-soft: #e4f2f0;
  --teal-ink: #0e5b58;
  --amber: #b56a18;
  --amber-soft: #fdf0dd;
  --amber-ink: #7e4710;
  --paper: #eef0f1;
  --surface: #ffffff;
  --ink: #1c252d;
  --muted: #60707d;
  --line: #d7dde1;
  --card-shadow: 0 12px 32px rgba(20, 38, 63, 0.08);
}

@media (prefers-color-scheme: dark) {
  :root {
    --navy: #101c2d;
    --navy-2: #19314f;
    --teal: #59bbb5;
    --teal-soft: #173a38;
    --teal-ink: #a8e4e0;
    --amber: #e2a458;
    --amber-soft: #46311d;
    --amber-ink: #ffcf8c;
    --paper: #11181f;
    --surface: #1a242e;
    --ink: #eef2f3;
    --muted: #aab7c0;
    --line: #364653;
    --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  line-height: 1.62;
}

h1, h2, h3, h4 {
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.18;
  font-weight: 700;
}

a {
  color: inherit;
}

.page-shell {
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top);
  background: var(--paper);
}

.masthead {
  background: linear-gradient(112deg, var(--navy) 0%, var(--navy-2) 62%, #115e5c 100%);
  color: #fff;
}

.masthead-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 52px 28px 42px;
}

.kicker {
  margin: 0 0 16px;
  color: #9be1db;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.masthead h1 {
  max-width: 920px;
  margin: 0;
  font-size: clamp(38px, 6vw, 68px);
  letter-spacing: -.035em;
}

.subject-line {
  display: grid;
  grid-template-columns: 1fr 1.45fr;
  gap: 28px;
  margin-top: 38px;
  padding-top: 25px;
  border-top: 1px solid rgba(255,255,255,.22);
}

.subject-line > div {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.label {
  display: block;
  color: #9fb0c3;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.subject-line strong {
  font-size: 17px;
  line-height: 1.45;
}

.platforms {
  margin: 24px 0 0;
  max-width: 1000px;
  color: #dce7ef;
  font-size: 14px;
  line-height: 1.65;
}

.platforms .label {
  color: #9be1db;
  margin-bottom: 5px;
}

.toc {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 20;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}

.toc-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 12px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.toc-title {
  color: var(--navy);
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
}

.toc-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.toc-links a {
  color: var(--muted);
  padding: 6px 9px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
}

.toc-links a:hover, .toc-links a:focus-visible {
  color: var(--teal-ink);
  background: var(--teal-soft);
  outline: none;
}

.content {
  max-width: 1180px;
  margin: 0 auto;
  padding: 32px 28px 70px;
}

.synthesis {
  background: var(--surface);
  border-top: 5px solid var(--teal);
  box-shadow: var(--card-shadow);
  padding: 32px 38px 36px;
}

.synthesis-rule {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  color: var(--teal-ink);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.synthesis h2 {
  max-width: 820px;
  margin: 0 0 14px;
  color: var(--navy);
  font-size: clamp(29px, 4vw, 43px);
}

.synthesis > p {
  max-width: 940px;
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  line-height: 1.7;
}

.balance-strip {
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  margin-top: 28px;
  border: 1px solid var(--line);
}

.balance-strip > div {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
}

.balance-celtic {
  background: var(--teal-soft);
  color: var(--teal-ink);
}

.balance-germanic {
  background: var(--amber-soft);
  color: var(--amber-ink);
}

.balance-strip strong {
  font-family: Georgia, serif;
  font-size: 25px;
}

.balance-strip span {
  font-size: 13px;
  line-height: 1.5;
}

.document-section {
  padding-top: 68px;
}

.section-heading {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  margin-bottom: 24px;
}

.section-number {
  flex: 0 0 auto;
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  background: var(--navy);
  color: #fff;
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 700;
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--teal);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.section-heading h2 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(29px, 4vw, 42px);
}

.section-intro {
  max-width: 860px;
  color: var(--muted);
  font-size: 17px;
}

.subsection-title {
  margin: 38px 0 15px;
  color: var(--navy);
  font-size: 23px;
}

.table-wrap {
  overflow-x: auto;
  background: var(--surface);
  box-shadow: var(--card-shadow);
  border: 1px solid var(--line);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
  font-size: 14px;
  line-height: 1.55;
}

th, td {
  padding: 17px 18px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line);
}

thead th {
  background: var(--navy);
  color: #fff;
  font-family: Georgia, serif;
  font-size: 15px;
}

tbody th {
  color: var(--navy);
  font-weight: 800;
}

tbody tr:last-child th, tbody tr:last-child td {
  border-bottom: 0;
}

.celtic-head {
  background: var(--teal) !important;
}

.germanic-head {
  background: var(--amber) !important;
}

.celtic-cell {
  background: color-mix(in srgb, var(--teal-soft) 72%, transparent);
}

.germanic-cell {
  background: color-mix(in srgb, var(--amber-soft) 72%, transparent);
}

.table-note {
  margin: 13px 2px 0;
  color: var(--muted);
  font-size: 13px;
}

.legend-celtic {
  color: var(--teal-ink);
  font-weight: 800;
}

.legend-germanic {
  color: var(--amber-ink);
  font-weight: 800;
}

.quadrant-table {
  min-width: 900px;
}

.quad {
  display: inline-block;
  width: 34px;
  height: 34px;
  margin-right: 8px;
  line-height: 34px;
  text-align: center;
  background: var(--teal-soft);
  color: var(--teal-ink);
  border-radius: 50%;
  font-size: 14px;
}

.quadrant-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 16px;
}

.mini-card {
  padding: 20px;
  background: var(--surface);
  border-left: 4px solid var(--teal);
  box-shadow: var(--card-shadow);
}

.mini-card span {
  color: var(--teal);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .12em;
}

.mini-card h3 {
  margin: 5px 0 6px;
  color: var(--navy);
  font-size: 20px;
}

.mini-card p {
  margin: 0;
  color: var(--muted);
}

.foundation-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.foundation-list li {
  padding: 22px;
  background: var(--surface);
  border-top: 3px solid var(--teal);
  box-shadow: var(--card-shadow);
}

.foundation-list strong {
  display: block;
  margin-bottom: 8px;
  color: var(--navy);
  font-family: Georgia, serif;
  font-size: 18px;
}

.period-table {
  min-width: 760px;
}

.population-grid {
  display: grid;
  grid-template-columns: 1.25fr .95fr;
  gap: 16px;
  align-items: start;
}

.population-card {
  padding: 24px;
  background: var(--surface);
  box-shadow: var(--card-shadow);
}

.card-label {
  margin: 0 0 14px;
  color: var(--teal);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.population-card h4 {
  margin: 24px 0 12px;
  color: var(--navy);
  font-size: 19px;
}

.population-card h4:first-of-type {
  margin-top: 0;
}

.population-card ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

.population-card li {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}

.population-card li:last-child {
  border-bottom: 0;
}

.population-card li span {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.modern-label {
  display: block;
  flex: 1;
  min-width: 0;
}

.modern-label > span {
  display: block;
}

.population-card li strong {
  flex: 0 0 auto;
  color: var(--teal-ink);
  font-variant-numeric: tabular-nums;
}

.modern-card {
  background: var(--navy);
  color: #edf3f6;
}

.modern-card .card-label {
  color: #9be1db;
}

.modern-card h4 {
  color: #fff;
}

.modern-card li {
  border-color: rgba(255,255,255,.18);
}

.modern-card li strong {
  color: #9be1db;
}

.modern-list small {
  display: block;
  color: #aebfce;
  font-size: 12px;
  line-height: 1.4;
}

.pca-note {
  margin-top: 24px;
  padding: 20px;
  background: rgba(255,255,255,.09);
  border-left: 3px solid var(--teal);
}

.pca-note h4 {
  margin: 0 0 8px;
}

.pca-note p {
  margin: 0;
  color: #dce7ef;
  font-size: 14px;
}

.calculator-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  align-items: start;
}

.calc-card {
  padding: 24px;
  background: var(--surface);
  box-shadow: var(--card-shadow);
  min-width: 0;
}

.calc-card h4 {
  margin: 0;
  color: var(--navy);
  font-size: 20px;
}

.calc-sub {
  margin: 20px 0 8px;
  color: var(--teal);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.component-list, .distance-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.component-list li, .distance-list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  overflow-wrap: anywhere;
}

.component-list li span, .distance-list li span {
  min-width: 0;
}

.component-list li strong, .distance-list li strong {
  flex: 0 0 auto;
  color: var(--teal-ink);
  font-variant-numeric: tabular-nums;
}

.trace {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.oracle {
  padding: 14px;
  background: var(--teal-soft);
  color: var(--teal-ink);
  font-size: 14px;
}

.archaic-table {
  min-width: 820px;
}

.archaic-table tbody th {
  width: 200px;
}

footer {
  border-top: 1px solid var(--line);
  padding: 30px 28px 42px;
  text-align: center;
  color: var(--muted);
}

footer p {
  max-width: 900px;
  margin: 0 auto 6px;
  font-size: 14px;
}

@media (max-width: 760px) {
  .masthead-inner {
    padding: 38px 18px 32px;
  }

  .subject-line {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .toc-inner {
    padding: 10px 14px;
  }

  .toc-title {
    display: none;
  }

  .toc-links {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .toc-links a {
    white-space: nowrap;
  }

  .content {
    padding: 22px 14px 48px;
  }

  .synthesis {
    padding: 24px 20px;
  }

  .synthesis > p {
    font-size: 16px;
  }

  .synthesis-rule span:last-child {
    display: none;
  }

  .balance-strip {
    grid-template-columns: 1fr;
  }

  .document-section {
    padding-top: 48px;
  }

  .section-heading {
    gap: 12px;
  }

  .section-number {
    width: 46px;
    height: 46px;
    font-size: 18px;
  }

  .foundation-list, .quadrant-cards, .population-grid, .calculator-grid {
    grid-template-columns: 1fr;
  }

  th, td {
    padding: 14px 12px;
  }
}

@media (prefers-color-scheme: dark) {
  .toc {
    background: rgba(22, 32, 42, .96);
  }

  .toc-title {
    color: #fff;
  }

  .synthesis h2, .section-heading h2, .subsection-title, .mini-card h3, .population-card h4, .calc-card h4, tbody th, .foundation-list strong {
    color: #edf4f4;
  }
}

@media print {
  :root {
    --paper: #fff;
    --surface: #fff;
  }

  body {
    background: #fff;
  }

  .toc {
    position: static;
  }

  .page-shell {
    padding-top: 0;
  }

  .masthead {
    background: #14263f !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .content {
    max-width: none;
    padding: 20px 0;
  }

  .synthesis, .table-wrap, .population-card, .calc-card, .mini-card, .foundation-list li {
    box-shadow: none;
    -moz-column-break-inside: avoid;
         break-inside: avoid;
  }

  .document-section {
    -moz-column-break-before: auto;
         break-before: auto;
  }

  .toc-links a {
    color: #333;
  }
}
</style>
